[build-system]
requires = ["setuptools==84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "daytrace"
version = "0.1.0"
description = "Local Windows foreground activity collector"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
ui = ["PySide6>=6.7.0,<6.9.0"]
content = ["comtypes==1.4.17"]
ocr = ["comtypes==1.4.17", "rapidocr==3.10.0", "onnxruntime==1.23.2", "mss==10.2.0", "msvc-runtime==14.51.36231; sys_platform == 'win32'"]
diary = ["PySide6>=6.7.0,<6.9.0", "comtypes==1.4.17"]

[project.scripts]
daytrace = "daytrace.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
daytrace = ["storage/migrations/*.sql"]
